<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="500Hours：低压力、可验证的语言学习时间累计器。">
  <title>500Hours · 语言学习时间</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="authPanel" class="auth-shell">
    <form id="authForm" class="auth-card" novalidate>
      <div class="brand">500HOURS</div>
      <h1>登录后继续积累</h1>
      <p class="auth-intro">学习记录保存在你的云端账号中。第一次使用请先注册。</p>
      <div class="field">
        <label for="email">邮箱</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required>
      </div>
      <div class="auth-actions">
        <button id="loginButton" class="primary-button" type="submit">登录</button>
        <button id="signupButton" class="secondary-button" type="button">注册账号</button>
      </div>
      <button id="forgotPasswordButton" class="text-button auth-forgot" type="button">忘记密码？</button>
      <p id="authMessage" class="message" role="status" aria-live="polite"></p>
      <p class="online-note">此版本必须联网才能登录和入账。每个账号的数据相互隔离。</p>
    </form>
  </main>

  <div id="appShell" class="hidden">
    <header class="topbar">
      <div class="brand">500HOURS</div>
      <div class="language-tabs" role="tablist" aria-label="学习语言">
        <button class="language-tab active" id="tab-en" role="tab" aria-selected="true" aria-controls="page-en" data-page="en">英语</button>
        <button class="language-tab" id="tab-ja" role="tab" aria-selected="false" aria-controls="page-ja" data-page="ja">日语</button>
      </div>
      <div class="account-area">
        <span id="syncState" class="sync-state">云端已连接</span>
        <button id="accountButton" class="account-button" type="button" aria-expanded="false" aria-controls="accountMenu"><span id="accountInitial">我</span></button>
        <div id="accountMenu" class="account-menu hidden">
          <strong id="accountEmail"></strong>
          <button id="changePasswordButton" type="button">修改密码</button>
          <button id="logoutButton" type="button">退出登录</button>
        </div>
      </div>
    </header>

    <main id="pages" class="app-main"></main>
  </div>

  <dialog id="passwordDialog" class="modal">
    <form id="passwordForm" novalidate>
      <div class="modal-heading">
        <div><span class="eyebrow">账号安全</span><h2>设置新密码</h2></div>
        <button id="closePasswordDialog" class="icon-button" type="button" aria-label="关闭">×</button>
      </div>
      <p class="modal-copy">请输入至少 8 位的新密码。修改后请使用新密码登录。</p>
      <div class="field"><label for="newPassword">新密码</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="field"><label for="confirmPassword">确认新密码</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></div>
      <button id="savePasswordButton" class="primary-button full-button" type="submit">保存新密码</button>
      <p id="passwordMessage" class="message" role="status" aria-live="polite"></p>
    </form>
  </dialog>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="domain.js"></script>
  <script src="app.js"></script>
</body>
</html>
